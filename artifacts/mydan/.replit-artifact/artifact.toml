kind = "web"
previewPath = "/mydan/"
title = "ميدان — Mydan PWA"
description = "تطبيق عربي قابل للتثبيت لمشرفي المبيعات الميدانية، مرتبط بـ Supabase وإعدادات الشركة."
version = "1.0.0"
id = "artifacts/mydan"
router = "path"

[[services]]
name = "web"
paths = [ "/mydan/" ]
localPort = 20017

[services.development]
run = "pnpm --filter @workspace/mydan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mydan", "run", "build" ]
serve = "static"
publicDir = "artifacts/mydan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20017"
BASE_PATH = "/mydan/"
