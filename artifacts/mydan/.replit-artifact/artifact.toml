kind = "web"
previewPath = "/"
title = "ميدان — Mydan Web PWA"
description = "تطبيق React وVite عربي قابل للتثبيت من Chrome وSafari، مرتبط بـ Supabase."
version = "1.0.0"
id = "artifacts/mydan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20017

[services.development]
run = "pnpm --filter @workspace/mydan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mydan", "run", "build" ]
serve = "static"
publicDir = "artifacts/mydan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20017"
BASE_PATH = "/"