<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل — ميدان</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #F8FAFC;
      color: #1e293b;
      font-family: 'Cairo', system-ui, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #EFF6FF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; color: #1A56DB; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #1A56DB; }
    p  { font-size: 1rem; color: #64748b; max-width: 280px; line-height: 1.7; }
    button {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      background: #1A56DB;
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:active { background: #1447b8; }
    .hint { font-size: 0.8rem; color: #94a3b8; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>أنت غير متصل بالإنترنت</h1>
  <p>تحقق من اتصالك بالشبكة ثم حاول مجدداً. البيانات المحفوظة مسبقاً متاحة بدون إنترنت.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
  <span class="hint">ميدان — نظام إدارة الميدان</span>
</body>
</html>
