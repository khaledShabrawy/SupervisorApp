# These are two source guardrails, not an AI review or a certification of offline behavior.
name: Architecture source guardrails
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep server credentials out of browser source
        run: |
          if rg -l 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_' artifacts/mydan/src; then
            echo 'Server credential reference in browser source'
            exit 1
          fi
      - name: Keep Android assets bundled locally
        run: |
          if rg '^[[:space:]]*url:' artifacts/mydan/capacitor.config.ts; then
            echo 'Review remote Android server configuration'
            exit 1
          fi
