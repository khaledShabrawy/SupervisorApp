name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Architecture & Policy Guardrails
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Architecture & Safety Checklist
        run: |
          echo "=== Mydan Architectural Guardrail Check ==="
          
          # Check 1: Ensure no service_role key leaked in client code
          if grep -rn "service_role" artifacts/mydan/src/ 2>/dev/null; then
            echo "❌ CRITICAL: service_role key referenced in client code!"
            exit 1
          fi
          
          # Check 2: Ensure Android capacitor mode remains 100% native offline
          if grep -rn "server:" artifacts/mydan/capacitor.config.ts 2>/dev/null | grep -v "//" | grep "url"; then
            echo "❌ CRITICAL: Remote server URL found in capacitor.config.ts! Android app must remain 100% native & offline."
            exit 1
          fi
          
          echo "✅ All Mydan architectural guardrails passed!"

      - name: Post PR Review Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = `### Mydan architecture checks
            Result: **${status}**. Checks cover client credential references and remote mobile server configuration.
            TypeScript, browser, database and build results are reported by their separate jobs.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
