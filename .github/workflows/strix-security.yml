name: Strix Security Scan

# Runs automatically on PRs (diff-scoped code review — no network calls, no live domain).
# Manual workflow_dispatch allows full or deep scans on demand.
#
# Required repo secrets:
#   STRIX_LLM       — model id, e.g. anthropic/claude-haiku-4-5 or openrouter/z-ai/glm-5.3
#   STRIX_LLM_API_KEY — provider API key for the chosen model
#
# Security guardrails (CLAUDE.md):
#   - Scans SOURCE CODE only (--target ./artifacts/mydan/src).
#   - Live domain testing (mydan.digityoucan.com) is NEVER triggered here.
#   - Any live/black-box pentest requires owner approval in a separate workflow.

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/mydan/src/**'
      - 'supabase/functions/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan depth'
        required: true
        default: 'quick'
        type: choice
        options: [quick, standard, deep]
      max_budget:
        description: 'Max LLM cost USD'
        required: true
        default: '10'
      target_path:
        description: 'Target path relative to repo root'
        required: false
        default: 'artifacts/mydan/src'

jobs:
  strix-sast:
    name: Static Security Analysis (SAST — code only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM || 'anthropic/claude-haiku-4-5' }}
      LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for diff-scope resolution on PRs

      - name: Verify LLM key is configured
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::STRIX_LLM_API_KEY secret is not set. Add it in repo Settings → Secrets."
            exit 1
          fi

      - name: Verify Docker is available
        run: docker info

      - name: Install Strix CLI
        run: curl -sSL https://strix.ai/install | bash

      - name: Run SAST scan (PR — diff-scoped)
        if: github.event_name == 'pull_request'
        run: |
          strix -n \
            -t "./${{ github.event.inputs.target_path || 'artifacts/mydan/src' }}" \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base "origin/${{ github.base_ref }}" \
            --max-budget 10 \
            2>&1 | tee strix-output.txt
        continue-on-error: true

      - name: Run SAST scan (manual — full target)
        if: github.event_name == 'workflow_dispatch'
        run: |
          strix -n \
            -t "./${{ github.event.inputs.target_path || 'artifacts/mydan/src' }}" \
            --scan-mode ${{ github.event.inputs.scan_mode }} \
            --max-budget ${{ github.event.inputs.max_budget }} \
            2>&1 | tee strix-output.txt
        continue-on-error: true

      # Fail-closed: a scan that hit the hard budget stop exits 0 but status = "stopped".
      # Enforce completion explicitly so the build never passes on incomplete coverage.
      - name: Fail unless the scan completed
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          if [ -z "$run_json" ]; then
            echo "::error::No strix run.json found — did the scan start correctly?"
            exit 1
          fi
          status=$(jq -r .status "$run_json")
          cost=$(jq -r '.llm_usage.cost // "unknown"' "$run_json")
          echo "Scan status: $status | LLM cost: \$$cost"
          if [ "$status" != "completed" ]; then
            echo "::error::Strix run status is '$status' — scan did not complete (likely budget exhausted). Raise --max-budget."
            exit 1
          fi

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: strix_runs
        continue-on-error: true

      - name: Upload full report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strix-report-${{ github.run_id }}
          path: |
            strix_runs/
            strix-output.txt
          retention-days: 30

      - name: Fail build on critical findings
        run: |
          vuln_file=$(ls strix_runs/*/vulnerabilities.json 2>/dev/null | head -1)
          if [ -z "$vuln_file" ]; then
            echo "No vulnerabilities.json — no findings reported."
            exit 0
          fi
          critical=$(jq '[.[] | select(.severity=="critical")] | length' "$vuln_file" 2>/dev/null || echo 0)
          high=$(jq '[.[] | select(.severity=="high")] | length' "$vuln_file" 2>/dev/null || echo 0)
          echo "Critical: $critical | High: $high"
          if [ "$critical" -gt 0 ]; then
            echo "::error::$critical critical vulnerability(ies) found. Review the strix-report artifact."
            exit 2
          fi
          if [ "$high" -gt 0 ]; then
            echo "::warning::$high high-severity finding(s) found. Review the strix-report artifact."
          fi
